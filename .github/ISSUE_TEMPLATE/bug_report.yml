name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste your POESESSID**, tokens or personal file paths. Calculation bugs that also happen in normal Path of Building belong [upstream](https://github.com/PathOfBuildingCommunity/PathOfBuilding/issues)."
  - type: input
    id: version
    attributes:
      label: PoB Agent Edition version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: AI app
      options: [Claude Desktop, Claude Code, Codex, Other / not AI related]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A pobb.in link or build code helps a lot.
  - type: textarea
    id: logs
    attributes:
      label: Error message or log (remove secrets and personal paths)
      render: text
